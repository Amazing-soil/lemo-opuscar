# Builds the style gallery (styleboard/) and publishes it to GitHub Pages on every push to main.
# Films: 720p cuts from the "web" release are copied into the site; full quality stays on the "films" release.
name: gallery

on:
  push:
    branches: [main]
    paths: ['styleboard/**', 'styles/*/poster.jpg', 'styles/*/STYLE.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 styleboard/build.py --site _site
      # 720p cuts live on the "web" release; Pages serves them as video/mp4 (Safari won't play Release downloads)
      - run: gh release download web --repo "$GITHUB_REPOSITORY" --pattern '*.mp4' --dir _site/films
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
