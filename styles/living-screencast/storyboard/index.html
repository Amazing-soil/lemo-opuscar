<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
@font-face{font-family:News;src:url(fonts/Newsreader-VF.ttf);font-weight:200 800}
@font-face{font-family:News;src:url(fonts/Newsreader-Italic-VF.ttf);font-style:italic;font-weight:200 800}
@font-face{font-family:Mono;src:url(fonts/JetBrainsMono-var.ttf);font-weight:100 800}
:root{
  --ivory:#FAF9F5; --oat:#F0EEE6; --side:#F4F2EC; --line:#E6E3D9; --line2:#D9D5C8;
  --ink:#1F1E1C; --ink2:#3D3B37; --mute:#85827A; --clay:#D97757; --clay2:#BD5D3A; --clayT:#F6E3DA;
  --add:#E7F3E8; --addI:#2F7D3F; --del:#FBE9E7; --delI:#B4432F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#E9E3D6}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
/* 桌面：暖色抽象壁纸 */
#wall{position:absolute;inset:-600px;background:
  radial-gradient(900px 620px at 18% 22%,#F3D9C6 0,transparent 70%),
  radial-gradient(1000px 700px at 86% 80%,#E7C6AE 0,transparent 70%),
  radial-gradient(700px 500px at 70% 10%,#EFE6D2 0,transparent 70%),#E9E1D1}
#menubar{position:absolute;left:0;right:0;top:0;height:30px;background:rgba(250,249,245,.55);backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:22px;padding:0 20px;font-size:13.5px;font-weight:500;color:#2a2926}
#menubar b{font-weight:700}
#menubar .r{margin-left:auto;display:flex;gap:18px;color:#3a3935}
/* 窗口 */
.win{position:absolute;background:var(--ivory);border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.09),0 30px 80px rgba(60,40,20,.22),0 8px 24px rgba(60,40,20,.12)}
.tbar{height:46px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:var(--side);position:relative}
.lights{display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:#EC6A5E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(2){background:#F4BF4F}.lights i:nth-child(3){background:#61C554}
.seg{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;background:#E9E6DD;border-radius:9px;padding:3px;font-size:13.5px;font-weight:500;color:var(--mute)}
.seg span{padding:5px 18px;border-radius:7px}.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.body{position:absolute;top:46px;left:0;right:0;bottom:0;display:flex}
.side{width:262px;background:var(--side);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.newbtn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;font-weight:600;color:var(--ink2)}
.newbtn .k{margin-left:auto;font-size:12px;color:var(--mute);font-weight:500}
.sect{font-size:12px;color:var(--mute);font-weight:600;padding:14px 11px 6px;letter-spacing:.02em}
.sess{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;color:var(--ink2)}
.sess.on{background:#E8E4DA;color:var(--ink);font-weight:500}
.sess .dot{width:8px;height:8px;border-radius:2px;background:#C9C4B6}
.sess .dot.run{background:var(--clay);box-shadow:0 0 0 3px var(--clayT)}
.side .proj{margin-top:auto;border-top:1px solid var(--line);padding:12px 11px 2px;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.side .proj b{color:var(--ink2);font-weight:600}
.main{flex:1;display:flex;min-width:0}
.chat{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.msgs{flex:1;padding:34px 56px 0;display:flex;flex-direction:column;gap:16px;font-size:16px;line-height:1.55;overflow:hidden}
.u{align-self:flex-end;background:var(--oat);border-radius:16px;padding:11px 16px;max-width:78%}
.u .at,.pb .at{color:var(--clay2);background:var(--clayT);border-radius:5px;padding:0 4px;font-weight:500}
.a{max-width:92%;color:var(--ink2)}
.tool{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);padding:3px 0}
.tool b{color:var(--ink2);font-weight:600}.tool code{font-family:Mono;font-size:13px;color:var(--ink2)}
.tool .g{width:16px;height:16px;border-radius:4px;background:var(--oat);display:grid;place-items:center;font-size:10px;color:var(--mute)}
.stat{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 14px;font-size:14.5px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat .p{color:var(--addI)}.stat .m{color:var(--delI)}
.pb{margin:18px 40px 26px;border:1px solid var(--line2);background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(60,40,20,.06);padding:16px 18px 12px;position:relative}
.pb .txt{font-size:17px;min-height:52px;line-height:1.5}
.pb .ph{color:#A9A59B}
.caret{display:inline-block;width:2px;height:21px;background:var(--clay);vertical-align:-4px;margin-left:1px}
.pb .row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13.5px;color:var(--mute)}
.pill{border:1px solid var(--line2);border-radius:8px;padding:5px 10px;font-weight:500;color:var(--ink2);display:flex;gap:6px;align-items:center;background:#fff}
.pill.plan{background:#EEF0FA;border-color:#C9CDEA;color:#3F4AA0}
.pill.acc{background:#FBEDE6;border-color:#EDC6B4;color:var(--clay2)}
.plus{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;font-size:18px;color:var(--mute)}
.send{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--clay);display:grid;place-items:center}
.pop{position:absolute;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 36px rgba(60,40,20,.16);padding:6px;font-size:14.5px;z-index:5}
.pop .it{padding:9px 12px;border-radius:8px;display:flex;gap:12px;align-items:center}
.pop .it.hl{background:var(--oat)}
.pop .it small{color:var(--mute);font-size:12.5px;display:block;font-weight:400}
.pop .it .kb{margin-left:auto;color:var(--mute);font-size:12px}
.greet{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:News;font-size:44px;font-weight:350;color:var(--ink2);letter-spacing:-.01em}
/* 右侧面板 */
.pane{width:0;border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;overflow:hidden}
.pane .ph2{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 10px;font-size:13.5px;background:var(--ivory)}
.pane .ph2 span{padding:6px 12px;border-radius:7px;color:var(--mute);font-weight:500}.pane .ph2 .on{background:var(--oat);color:var(--ink)}
.pane .pc{flex:1;position:relative;overflow:hidden}
.tree{padding:14px 10px;font-size:14px;font-family:Mono;color:var(--ink2)}
.tree div{padding:5px 10px;border-radius:6px;white-space:pre}
.tree .lit{background:var(--clayT);color:var(--clay2)}
.plan{padding:26px 30px;font-size:15.5px;line-height:1.6}
.plan h3{font-family:News;font-weight:500;font-size:26px;margin-bottom:6px}
.plan .meta{font-size:13px;color:var(--mute);margin-bottom:18px;display:flex;gap:10px;align-items:center}
.badge{border-radius:6px;padding:2px 8px;font-weight:600;font-size:12.5px;background:#EEF0FA;color:#3F4AA0}
.plan ol{padding-left:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.plan li{display:flex;gap:12px}
.plan li .n{flex:none;width:24px;height:24px;border-radius:6px;background:var(--oat);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink2)}
.plan li.ghost{opacity:.28}
.plan code,.a code{font-family:Mono;font-size:13.5px;background:var(--oat);padding:1px 5px;border-radius:5px}
.diff{display:flex;height:100%}
.files{width:210px;border-right:1px solid var(--line);padding:12px 8px;font-size:13.5px;background:var(--ivory)}
.files div{padding:7px 10px;border-radius:7px;display:flex;gap:6px}.files .on{background:var(--oat);font-weight:600}
.files .p{color:var(--addI);margin-left:auto;font-weight:600}.files .m{color:var(--delI);font-weight:600}
.code{flex:1;font-family:Mono;font-size:14.5px;line-height:27px;padding-top:12px;position:relative}
.code .l{display:flex;white-space:pre;padding-right:12px}
.code .l .no{width:48px;text-align:right;padding-right:14px;color:#B8B3A6;flex:none}
.code .l .sg{width:18px;flex:none;color:#B8B3A6}
.code .l.add{background:var(--add)}.code .l.add .sg,.code .l.add .no{color:var(--addI)}
.code .l.del{background:var(--del)}.code .l.del .sg,.code .l.del .no{color:var(--delI)}
.code .l.sel{box-shadow:inset 3px 0 0 var(--clay)}
.cm{margin:6px 16px 6px 66px;border:1px solid var(--line2);border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(60,40,20,.10);font-family:Inter;font-size:15px;line-height:1.5;padding:12px 14px}
.cm .who{font-size:12.5px;color:var(--mute);margin-bottom:4px}
.cm .hint{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mute)}
.kbd{border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px;background:var(--ivory)}
.k{color:#9A4E8E}.s{color:#3F7A4A}.f{color:#355F9E}.c{color:#A5A094}
.url{margin:8px 10px;height:32px;border-radius:8px;background:var(--oat);display:flex;align-items:center;padding:0 12px;font-size:13.5px;color:var(--ink2);gap:8px}
.app{position:absolute;inset:0;top:48px;display:flex;flex-direction:column;align-items:center}
.app .hd{align-self:stretch;height:64px;display:flex;align-items:center;padding:0 28px;gap:10px;font-weight:700;font-size:19px}
.app .tm{width:22px;height:22px;border-radius:50%;background:#E0543A;position:relative}
.app .tm:after{content:'';position:absolute;left:8px;top:-4px;width:7px;height:6px;background:#4E8A3E;border-radius:3px 3px 1px 1px}
.app .tg{margin-left:auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.app .big{margin-top:92px;font-family:News;font-size:150px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.app .sub{font-size:16px;margin-top:4px;opacity:.6}
.app .btns{display:flex;gap:14px;margin-top:46px}
.app .btns span{padding:14px 34px;border-radius:14px;font-weight:600;font-size:17px}
.light{background:#FFF8F0;color:#2B2320}.light .tg{background:#F4E7D8}.light .b1{background:#E0543A;color:#fff}.light .b2{background:#F4E7D8}
.dark{background:#1E1A18;color:#F4EDE4}.dark .tg{background:#352E2A}.dark .b1{background:#E0543A;color:#fff}.dark .b2{background:#352E2A}
.term{background:#1F1D1A;color:#E8E2D6;font-family:Mono;font-size:14px;line-height:22px;padding:12px 16px;white-space:pre}
.term .ok{color:#8BC48A}.term .dim{color:#8A857A}
.ci{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);background:var(--ivory);font-size:13.5px;color:var(--ink2)}
.ci .ok{color:var(--addI);font-weight:600}.tog{width:30px;height:18px;border-radius:9px;background:var(--clay);position:relative}.tog:after{content:'';position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
/* 终端窗口（开场） */
.twin{background:#1F1D1A;border-radius:12px}
.twin .tb2{height:34px;display:flex;align-items:center;padding:0 12px;background:#2A2724}
.twin pre{font-family:Mono;color:#E8E2D6;font-size:17px;line-height:26px;padding:16px 20px}
.twin .o{color:var(--clay)}
/* 叠层：不随镜头 */
#hud{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);max-width:1300px;text-align:center;font-size:33px;font-weight:500;line-height:1.3;letter-spacing:-.005em;
  color:#1F1E1C;background:rgba(250,249,245,.86);backdrop-filter:blur(14px);padding:12px 26px;border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 28px rgba(60,40,20,.12)}
.cap em{font-style:normal;color:var(--clay2)}
.keys{position:absolute;left:56px;bottom:58px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:#fff;
  background:rgba(31,30,28,.86);padding:10px 14px;border-radius:14px;backdrop-filter:blur(10px)}
.keys i{font-style:normal;min-width:36px;height:36px;padding:0 8px;border-radius:8px;background:#3A3834;display:grid;place-items:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);font-size:18px}
.keys span{margin-left:6px;color:#D8D2C6;font-weight:500}
.chap{position:absolute;left:56px;top:48px;display:flex;align-items:center;gap:14px;font-family:News;font-size:30px;font-weight:450;color:var(--ink);background:rgba(250,249,245,.9);backdrop-filter:blur(14px);padding:10px 20px 10px 12px;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 28px rgba(60,40,20,.12)}
.chap b{font-family:Inter;font-size:14px;font-weight:700;color:#fff;background:var(--clay);border-radius:7px;padding:5px 9px;letter-spacing:.04em}
.title{position:absolute;left:0;right:0;text-align:center}
.px{position:absolute;image-rendering:pixelated}
.ring{position:absolute;border-radius:50%;border:3px solid var(--clay);opacity:.7}
.shutter{position:absolute;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2000px rgba(255,255,255,.18)}
</style></head>
<body><div id="stage"><div id="world"></div><div id="hud"></div></div>
<script>
// ───────── Clawd：18×10 方像素（由 Claude Code 终端 logo 的象限字符 1:1 展开，每字符格=2×2 象限，行加倍成方像素）
const CLAY = '#D97757', EYE = '#2A2622';
function clawdGrid({ eyes = 'n', arms = 'down', legs = 'stand' } = {}) {
  const P = new Map(), put = (c, r, v = 1) => P.set(c + ',' + r, v);
  for (let r = 0; r < 8; r++) for (let c = 3; c <= 14; c++) put(c, r);          // 身体
  const armRows = arms === 'up' ? [0, 1, 2, 3] : [4, 5];
  if (arms === 'up') { for (const r of armRows) { put(1, r); put(2, r); put(15, r); put(16, r); } }
  else if (arms === 'right') { put(1, 4); put(2, 4); put(1, 5); put(2, 5); for (const r of [0, 1, 2, 3]) { put(15, r); put(16, r); } }
  else for (const r of armRows) for (const c of [1, 2, 15, 16]) put(c, r);
  const L = { stand: [[4, 2], [6, 2], [11, 2], [13, 2]], walkA: [[4, 2], [6, 1], [11, 2], [13, 1]], walkB: [[4, 1], [6, 2], [11, 1], [13, 2]], tuck: [[4, 1], [6, 1], [11, 1], [13, 1]] }[legs];
  for (const [c, h] of L) for (let r = 8; r < 8 + h; r++) put(c, r);
  const E = { n: [[5, 2], [5, 3], [12, 2], [12, 3]], r: [[6, 2], [6, 3], [13, 2], [13, 3]], l: [[4, 2], [4, 3], [11, 2], [11, 3]],
    blink: [[5, 3], [12, 3]], happy: [[4, 3], [5, 2], [6, 3], [11, 3], [12, 2], [13, 3]], wide: [[5, 1], [5, 2], [5, 3], [12, 1], [12, 2], [12, 3]] }[eyes];
  for (const [c, r] of E) put(c, r, 2);
  return P;
}
// x,y = 脚底中点（世界坐标）；px = 一个像素的边长
function clawd({ x, y, px = 7, flip = false, squash = 0, ...o }) {
  const P = clawdGrid(o); let s = '';
  const sy = 1 - squash, sx = 1 + squash * .6;
  for (const [k, v] of P) { let [c, r] = k.split(',').map(Number); if (flip) c = 17 - c;
    s += `<rect x="${c}" y="${r}" width="1.02" height="1.02" fill="${v === 2 ? EYE : CLAY}"/>`; }
  const w = 18 * px * sx, h = 10 * px * sy;
  return `<svg class="px" viewBox="0 0 18 10" width="${w}" height="${h}" style="left:${x - w / 2}px;top:${y - h}px" shape-rendering="crispEdges">${s}</svg>`;
}
// 像素道具：铅笔、感叹号、尘土、闪光——与 Clawd 同一像素网格
function pixart(rows, { x, y, px = 7, pal }) {
  let s = ''; rows.forEach((row, r) => [...row].forEach((ch, c) => { if (pal[ch]) s += `<rect x="${c}" y="${r}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; }));
  const W = rows[0].length, H = rows.length;
  return `<svg class="px" viewBox="0 0 ${W} ${H}" width="${W * px}" height="${H * px}" style="left:${x}px;top:${y}px" shape-rendering="crispEdges">${s}</svg>`;
}
const BANG = (x, y, px = 7) => pixart(['.www.', 'wwkww', 'wwkww', 'wwkww', 'wwwww', 'wwkww', '.www.', '..w..'], { x, y, px, pal: { w: '#fff', k: EYE } })
  + `<div style="position:absolute;left:${x - 2}px;top:${y - 2}px;width:${5 * px + 4}px;height:${7 * px + 4}px;border-radius:3px;box-shadow:0 0 0 2px ${EYE};opacity:0"></div>`;
const PENCIL = (x, y, px = 7) => pixart(['......kk', '.....yyk', '....yyy.', '...yyy..', '..yyy...', '.pyy....', 'ppy.....', 'k.......'], { x, y, px, pal: { y: '#F2C14E', k: EYE, p: '#E8A898' } });
const SPARK = (x, y, px = 6, col = '#F2C14E') => pixart(['..y..', '..y..', 'yy.yy', '..y..', '..y..'], { x, y, px, pal: { y: col } });
const DUST = (x, y, px = 6) => pixart(['.o..o', 'o.o..', '.....'], { x, y, px, pal: { o: '#CFC7B6' } });
const CHECK = (x, y, px = 6) => pixart(['.....g', '....gg', 'g..gg.', 'gggg..', '.gg...'], { x, y, px, pal: { g: '#2F7D3F' } });
// macOS 指针
const CURSOR = (x, y, s = 1.5) => `<svg style="position:absolute;left:${x - 2}px;top:${y - 2}px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))" width="${22 * s}" height="${30 * s}" viewBox="0 0 22 30"><path d="M2 2 L2 24 L7.5 18.5 L11 27 L15 25.2 L11.6 17 L19 17 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const RING = (x, y, r = 22) => `<div class="ring" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px"></div>`;

// ───────── Claude 应用窗口（纯 2D 重绘，不用截图）
const WIN = { x: 110, y: 74, w: 1700, h: 950 };
function sidebar(sess = [['Dark mode toggle', 1, 1], ['Fix flaky timer test', 0], ['Update README', 0]]) {
  return `<div class="side">
    <div class="newbtn"><span style="font-size:18px;color:var(--clay)">＋</span> New session <span class="k">⌘N</span></div>
    <div class="sect">SESSIONS</div>
    ${sess.map(([n, on, run]) => `<div class="sess ${on ? 'on' : ''}"><span class="dot ${run ? 'run' : ''}"></span>${n}</div>`).join('')}
    <div class="proj"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 3h4l1.5 1.5H13v7.5H1z" fill="none" stroke="#85827A" stroke-width="1.3"/></svg><b>tomato-timer</b> · main</div></div>`;
}
function promptBox({ text = '', ph = 'Describe a task, or type / for commands', mode = 'Manual', caret = true } = {}) {
  const cls = mode === 'Plan' ? 'plan' : mode === 'Accept edits' ? 'acc' : '';
  return `<div class="pb"><div class="txt">${text || `<span class="ph">${ph}</span>`}${caret ? '<span class="caret"></span>' : ''}</div>
    <div class="row"><span class="plus">＋</span><span class="pill ${cls}">${mode} ▾</span><span class="pill">Opus 5.5 ▾</span>
    <span class="send"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></div></div>`;
}
function appWin({ chat = '', prompt = {}, pane = null, paneW = 780, sess, greet = false, extra = '' } = {}) {
  return `<div class="win" style="left:${WIN.x}px;top:${WIN.y}px;width:${WIN.w}px;height:${WIN.h}px">
